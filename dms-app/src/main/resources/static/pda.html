<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDA 煎药操作终端</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #121b2f;
            --panel-strong: #18233c;
            --border: #22304d;
            --text: #e5edf7;
            --text-dim: #8ea2bf;
            --accent: #4dd0e1;
            --accent-2: #7dd3fc;
            --success: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: radial-gradient(circle at top, #18304f 0%, #0b1220 38%, #09101c 100%); color: var(--text); font-family: "Segoe UI", "PingFang SC", sans-serif; }
        body { display: flex; justify-content: center; }
        .app { width: 100%; max-width: 430px; min-height: 100%; display: flex; flex-direction: column; position: relative; }
        .topbar {
            padding: 16px 18px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(125,211,252,0.12);
            backdrop-filter: blur(10px);
            background: rgba(9, 16, 28, 0.72);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .topbar h1 { font-size: 17px; letter-spacing: 1px; }
        .topbar button {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--accent);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 12px;
        }
        .page { display: none; flex: 1; padding: 16px; }
        .page.active { display: block; }
        .hero {
            margin-top: 26px;
            margin-bottom: 20px;
            text-align: center;
        }
        .hero .icon { font-size: 42px; margin-bottom: 8px; }
        .hero .title { font-size: 24px; font-weight: 700; color: var(--accent); }
        .hero .subtitle { margin-top: 8px; color: var(--text-dim); font-size: 13px; line-height: 1.6; }
        .panel {
            background: linear-gradient(180deg, rgba(24,35,60,0.96), rgba(18,27,47,0.92));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.22);
            margin-bottom: 14px;
        }
        .field-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .input, .select {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(7, 12, 22, 0.9);
            color: var(--text);
            padding: 14px 14px;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 14px;
        }
        .input:focus, .select:focus { outline: none; border-color: var(--accent); }
        .btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn.primary {
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #062032;
        }
        .btn.secondary {
            background: rgba(77,208,225,0.08);
            color: var(--accent);
            border: 1px solid rgba(77,208,225,0.28);
        }
        .btn.warn {
            background: rgba(245,158,11,0.12);
            color: #fbbf24;
            border: 1px solid rgba(245,158,11,0.26);
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .summary-item {
            background: rgba(7,12,22,0.88);
            border: 1px solid rgba(34,48,77,0.9);
            border-radius: 12px;
            padding: 12px;
        }
        .summary-item .label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
        .summary-item .value { font-size: 15px; font-weight: 700; word-break: break-all; }
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title strong { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; }
        .task-card {
            background: rgba(7,12,22,0.92);
            border: 1px solid rgba(34,48,77,0.9);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .task-card.active { border-color: rgba(77,208,225,0.45); box-shadow: 0 0 0 1px rgba(77,208,225,0.12) inset; }
        .task-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .task-code { font-size: 16px; font-weight: 700; color: var(--accent); }
        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .task-meta { color: var(--text-dim); font-size: 13px; line-height: 1.7; }
        .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
        .detail-sub { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
        .timeline { display: flex; flex-direction: column; gap: 8px; }
        .step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(34,48,77,0.8);
        }
        .step:last-child { border-bottom: none; }
        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-top: 4px;
            background: #516178;
            flex-shrink: 0;
        }
        .step.completed .step-dot { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.35); }
        .step.current .step-dot { background: var(--accent); box-shadow: 0 0 8px rgba(77,208,225,0.35); }
        .step-text { flex: 1; }
        .step-text strong { display: block; font-size: 14px; margin-bottom: 4px; }
        .step-text span { color: var(--text-dim); font-size: 12px; line-height: 1.5; }
        .empty {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            padding: 24px 12px;
        }
        .hint {
            color: var(--text-dim);
            font-size: 12px;
            line-height: 1.7;
            margin-top: 10px;
        }
        .toast-wrap {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: calc(100% - 32px);
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            border: 1px solid var(--border);
            background: rgba(18,27,47,0.96);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        }
        .toast.success { border-color: rgba(34,197,94,0.4); }
        .toast.error { border-color: rgba(239,68,68,0.45); }
        .toast.warn { border-color: rgba(245,158,11,0.45); }
        .status-pending { background: rgba(100,116,139,0.18); color: #c7d2fe; }
        .status-soaking { background: rgba(59,130,246,0.18); color: #93c5fd; }
        .status-soaked { background: rgba(6,182,212,0.18); color: #67e8f9; }
        .status-decocting { background: rgba(249,115,22,0.18); color: #fdba74; }
        .status-decocted { background: rgba(245,158,11,0.18); color: #fcd34d; }
        .status-pouring { background: rgba(168,85,247,0.18); color: #d8b4fe; }
        .status-poured { background: rgba(236,72,153,0.18); color: #f9a8d4; }
        .status-packaging { background: rgba(234,179,8,0.18); color: #fde047; }
        .status-completed { background: rgba(34,197,94,0.18); color: #86efac; }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <h1>煎药室 PDA</h1>
        <button id="logoutBtn" onclick="logout()" style="display:none;">退出登录</button>
    </div>

    <div class="page active" id="loginPage">
        <div class="hero">
            <div class="icon">📱</div>
            <div class="title">自动识别 PDA</div>
            <div class="subtitle">设备不扫码，只按已登记设备接入。<br>登录后自动绑定当前在线 PDA。</div>
        </div>
        <div class="panel">
            <div class="field-label">账号</div>
            <input class="input" id="userCode" placeholder="用户名 / 工号">
            <div class="field-label">密码</div>
            <input class="input" id="password" type="password" placeholder="请输入密码">
            <div class="field-label">设备 MAC</div>
            <input class="input" id="macAddress" placeholder="例如 AA:BB:CC:DD:EE:FF">
            <button class="btn primary" onclick="login()">登录并绑定设备</button>
            <div class="hint">说明：这里只认后台已登记的 PDA 设备 MAC，未登记设备不会进入生产链路。</div>
        </div>
    </div>

    <div class="page" id="tasksPage">
        <div class="panel">
            <div class="summary">
                <div class="summary-item">
                    <div class="label">当前登录</div>
                    <div class="value" id="summaryUser">-</div>
                </div>
                <div class="summary-item">
                    <div class="label">当前设备</div>
                    <div class="value" id="summaryDevice">-</div>
                </div>
                <div class="summary-item">
                    <div class="label">设备 MAC</div>
                    <div class="value" id="summaryMac">-</div>
                </div>
                <div class="summary-item">
                    <div class="label">在线状态</div>
                    <div class="value" id="summaryOnline">已接入</div>
                </div>
            </div>
            <button class="btn secondary" onclick="refreshTasks()">刷新任务</button>
        </div>

        <div class="section-title">
            <strong>最近任务</strong>
            <span id="taskCount" style="color:var(--text-dim);font-size:12px;">0 条</span>
        </div>
        <div id="taskList"></div>
    </div>

    <div class="page" id="detailPage">
        <div class="panel">
            <button class="btn secondary" style="margin-bottom:14px;" onclick="showTasksPage()">返回任务列表</button>
            <div class="detail-title" id="detailTitle">任务详情</div>
            <div class="detail-sub" id="detailSub">-</div>

            <div class="summary" style="margin-bottom:12px;">
                <div class="summary-item">
                    <div class="label">当前状态</div>
                    <div class="value" id="detailStatus">-</div>
                </div>
                <div class="summary-item">
                    <div class="label">当前设备</div>
                    <div class="value" id="detailDevice">未绑定</div>
                </div>
                <div class="summary-item">
                    <div class="label">处方号</div>
                    <div class="value" id="detailPrescription">-</div>
                </div>
                <div class="summary-item">
                    <div class="label">当前温度</div>
                    <div class="value" id="detailTemp">-</div>
                </div>
            </div>

            <div class="field-label">需要设备时选择生产设备</div>
            <select class="select" id="deviceSelect"></select>

            <div id="actionWrap"></div>
        </div>

        <div class="panel">
            <div class="section-title"><strong>工序轨迹</strong></div>
            <div class="timeline" id="stepTimeline"></div>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const API_BASE = '';
const storage = {
    token: 'pda_token_v2',
    login: 'pda_login_v2'
};
const STATUS_LABEL = {
    PENDING: '待泡药',
    SOAKING: '泡药中',
    SOAKED: '待煎药',
    DECOCTING: '煎药中',
    DECOCTED: '待出液',
    POURING: '出液中',
    POURED: '待包装',
    PACKAGING: '包装中',
    PACKAGED: '待贴标',
    LABELING: '待质检',
    INSPECTING: '待交接',
    COMPLETED: '已完成',
    CANCELLED: '已取消'
};
const STATUS_CLASS = {
    PENDING: 'status-pending',
    SOAKING: 'status-soaking',
    SOAKED: 'status-soaked',
    DECOCTING: 'status-decocting',
    DECOCTED: 'status-decocted',
    POURING: 'status-pouring',
    POURED: 'status-poured',
    PACKAGING: 'status-packaging',
    PACKAGED: 'status-packaging',
    LABELING: 'status-packaging',
    INSPECTING: 'status-packaging',
    COMPLETED: 'status-completed'
};
const STEP_TO_DEVICE_TYPE = {
    START_DECOCT: 1,
    START_PACKAGE: 2
};

let authToken = localStorage.getItem(storage.token) || '';
let loginState = parseJson(localStorage.getItem(storage.login)) || null;
let tasks = [];
let currentTask = null;

function parseJson(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

function toast(message, type = 'success') {
    const wrap = document.getElementById('toastWrap');
    const item = document.createElement('div');
    item.className = 'toast ' + type;
    item.textContent = message;
    wrap.appendChild(item);
    setTimeout(() => {
        item.style.opacity = '0';
        item.style.transform = 'translateY(-4px)';
        item.style.transition = 'all 0.3s ease';
        setTimeout(() => item.remove(), 300);
    }, 2600);
}

function normalizeMac(mac) {
    return (mac || '').trim().toUpperCase();
}

async function request(method, path, body, useAuth = true) {
    const headers = { 'Content-Type': 'application/json' };
    if (useAuth && authToken) {
        headers.Authorization = 'Bearer ' + authToken;
    }
    const options = { method, headers };
    if (body !== undefined && body !== null) {
        options.body = JSON.stringify(body);
    }
    const response = await fetch(API_BASE + path, options);
    let payload = null;
    try {
        payload = await response.json();
    } catch (e) {
        payload = { code: response.status, message: '接口返回不可解析' };
    }
    if (response.status === 401 && useAuth) {
        clearLoginState();
        showLoginPage();
        throw new Error(payload.message || '登录已失效');
    }
    return payload;
}

function clearLoginState() {
    authToken = '';
    loginState = null;
    localStorage.removeItem(storage.token);
    localStorage.removeItem(storage.login);
    document.getElementById('logoutBtn').style.display = 'none';
}

function showLoginPage() {
    showPage('loginPage');
}

function showTasksPage() {
    showPage('tasksPage');
}

function setSummary() {
    if (!loginState) return;
    document.getElementById('summaryUser').textContent = loginState.userName || loginState.userCode || '-';
    document.getElementById('summaryDevice').textContent = loginState.deviceCode || '-';
    document.getElementById('summaryMac').textContent = loginState.macAddress || '-';
    document.getElementById('summaryOnline').textContent = '已接入';
}

async function login() {
    const userCode = document.getElementById('userCode').value.trim();
    const password = document.getElementById('password').value;
    const macAddress = normalizeMac(document.getElementById('macAddress').value);
    if (!userCode || !password || !macAddress) {
        toast('请完整输入账号、密码和设备 MAC', 'warn');
        return;
    }

    const result = await request('POST', '/api/v1/pda/auth/login', {
        userCode,
        password,
        macAddress
    }, false);

    if (result.code !== 200 || !result.data || !result.data.token) {
        toast(result.message || '登录失败', 'error');
        return;
    }

    authToken = result.data.token;
    loginState = {
        userCode: result.data.userCode,
        userName: result.data.userName,
        deviceCode: result.data.deviceCode,
        deviceId: result.data.deviceId,
        macAddress: result.data.macAddress || macAddress
    };
    localStorage.setItem(storage.token, authToken);
    localStorage.setItem(storage.login, JSON.stringify(loginState));
    document.getElementById('logoutBtn').style.display = 'inline-block';
    setSummary();
    showTasksPage();
    toast('登录成功，设备已自动绑定');
    await refreshTasks();
}

async function logout() {
    if (authToken) {
        try {
            await request('POST', '/api/v1/pda/auth/logout', {});
        } catch (e) {
        }
    }
    clearLoginState();
    tasks = [];
    currentTask = null;
    document.getElementById('taskList').innerHTML = '';
    showLoginPage();
}

async function refreshTasks() {
    if (!authToken) return;
    const result = await request('GET', '/api/v1/pda/tasks/recent?limit=20');
    if (result.code !== 200 || !Array.isArray(result.data)) {
        toast(result.message || '加载任务失败', 'error');
        return;
    }
    tasks = result.data;
    renderTasks();
}

function renderTasks() {
    const list = document.getElementById('taskList');
    document.getElementById('taskCount').textContent = tasks.length + ' 条';
    if (!tasks.length) {
        list.innerHTML = '<div class="panel empty">当前账号下暂无可处理任务</div>';
        return;
    }
    list.innerHTML = tasks.map(task => {
        const statusClass = STATUS_CLASS[task.status] || 'status-pending';
        return `
            <div class="task-card ${currentTask && currentTask.taskId === task.taskId ? 'active' : ''}" onclick="openTask('${escapeJs(task.barcode)}', ${task.taskId})">
                <div class="task-head">
                    <div class="task-code">${escapeHtml(task.barcode || ('任务#' + task.taskId))}</div>
                    <div class="badge ${statusClass}">${escapeHtml(task.statusName || STATUS_LABEL[task.status] || task.status)}</div>
                </div>
                <div class="task-meta">
                    <div>患者：${escapeHtml(task.patientName || '-')}</div>
                    <div>任务ID：${task.taskId}</div>
                    <div>更新时间：${escapeHtml(task.updatedAt || '-')}</div>
                </div>
            </div>
        `;
    }).join('');
}

async function openTask(barcode, taskId) {
    const result = await request('GET', '/api/v1/pda/task/' + encodeURIComponent(barcode));
    if (result.code !== 200 || !result.data) {
        toast(result.message || '任务详情加载失败', 'error');
        return;
    }
    currentTask = result.data;
    currentTask.taskId = currentTask.taskId || taskId;
    renderCurrentTask();
    showPage('detailPage');
}

function renderCurrentTask() {
    if (!currentTask) return;
    document.getElementById('detailTitle').textContent = currentTask.barcode || ('任务 #' + currentTask.taskId);
    document.getElementById('detailSub').textContent =
        '患者：' + (currentTask.patientName || '-') + ' | 当前环节：' + (currentTask.currentStep || '待处理');
    document.getElementById('detailStatus').textContent = currentTask.statusName || STATUS_LABEL[currentTask.status] || currentTask.status || '-';
    document.getElementById('detailDevice').textContent = currentTask.deviceName || currentTask.deviceCode || '未绑定';
    document.getElementById('detailPrescription').textContent = currentTask.prescriptionNumber || '-';
    document.getElementById('detailTemp').textContent = currentTask.currentTemp != null ? currentTask.currentTemp + '℃' : '--';
    renderDeviceOptions();
    renderAction();
    renderTimeline();
}

function renderDeviceOptions() {
    const select = document.getElementById('deviceSelect');
    const currentDeviceCode = currentTask ? currentTask.deviceCode : '';
    const currentDeviceName = currentTask ? (currentTask.deviceName || currentTask.deviceCode || '') : '';
    const options = ['<option value="">不需要补绑设备</option>'];
    if (loginState && loginState.deviceCode) {
        options.push(`<option value="${escapeAttr(loginState.deviceCode)}">${escapeHtml(loginState.deviceCode)}（当前 PDA）</option>`);
    }
    if (currentDeviceCode && currentDeviceCode !== loginState.deviceCode) {
        options.push(`<option value="${escapeAttr(currentDeviceCode)}">${escapeHtml(currentDeviceName || currentDeviceCode)}（任务已绑）</option>`);
    }
    select.innerHTML = options.join('');
    if (currentDeviceCode) {
        select.value = currentDeviceCode;
    } else if (loginState && loginState.deviceCode) {
        select.value = loginState.deviceCode;
    }
}

function renderAction() {
    const wrap = document.getElementById('actionWrap');
    if (!currentTask || !currentTask.nextAction) {
        wrap.innerHTML = '<div class="hint">当前任务没有可执行工序，可能已完成或不在 PDA 操作范围内。</div>';
        return;
    }
    const action = currentTask.nextAction;
    const buttonClass = action.needDevice ? 'btn warn' : 'btn primary';
    const helper = action.needDevice
        ? '本步骤需要确认生产设备。若任务未绑定设备，会先绑定后执行。'
        : '执行后会推进到下一工序，并同步当前 PDA 登录人。';
    wrap.innerHTML = `
        <div class="field-label">当前操作</div>
        <button class="${buttonClass}" onclick="executeNextAction()">${escapeHtml(action.text || action.stepType)}</button>
        <div class="hint">${helper}</div>
    `;
}

function renderTimeline() {
    const timeline = document.getElementById('stepTimeline');
    const steps = currentTask && Array.isArray(currentTask.steps) ? currentTask.steps : [];
    if (!steps.length) {
        timeline.innerHTML = '<div class="empty">暂无工序轨迹</div>';
        return;
    }
    timeline.innerHTML = steps.map(step => {
        const cls = step.current ? 'step current' : step.completed ? 'step completed' : 'step';
        const desc = step.completedAt
            ? '完成时间：' + step.completedAt
            : step.current
                ? '当前待执行'
                : '未到达';
        return `
            <div class="${cls}">
                <div class="step-dot"></div>
                <div class="step-text">
                    <strong>${escapeHtml(step.label || step.value)}</strong>
                    <span>${escapeHtml(desc)}</span>
                </div>
            </div>
        `;
    }).join('');
}

async function executeNextAction() {
    if (!currentTask || !currentTask.nextAction) {
        return;
    }
    const action = currentTask.nextAction;
    const selectedDeviceCode = document.getElementById('deviceSelect').value.trim();
    let deviceId = currentTask.decoctDeviceId || currentTask.packageDeviceId || null;

    if (action.needDevice) {
        if (!selectedDeviceCode) {
            toast('当前步骤需要选择设备', 'warn');
            return;
        }
        if (!currentTask.deviceCode || currentTask.deviceCode !== selectedDeviceCode) {
            const bindResult = await request('POST', '/api/v1/pda/tasks/' + currentTask.taskId + '/bind-device', {
                deviceCode: selectedDeviceCode
            });
            if (bindResult.code !== 200) {
                toast(bindResult.message || '设备绑定失败', 'error');
                return;
            }
            toast('任务已绑定设备：' + selectedDeviceCode);
            const refreshed = await request('GET', '/api/v1/pda/task/' + encodeURIComponent(currentTask.barcode));
            if (refreshed.code === 200 && refreshed.data) {
                currentTask = refreshed.data;
                currentTask.taskId = currentTask.taskId || bindResult.data.taskId;
            }
        }
        deviceId = currentTask.decoctDeviceId || currentTask.packageDeviceId || loginState.deviceId || null;
    }

    const confirmResult = await request('POST', '/api/v1/pda/task/confirm', {
        taskId: currentTask.taskId,
        stepType: action.stepType,
        deviceId: deviceId
    });
    if (confirmResult.code !== 200) {
        toast(confirmResult.message || '工序执行失败', 'error');
        return;
    }

    toast('已执行：' + (action.text || action.stepType));
    await refreshTasks();
    const refreshed = await request('GET', '/api/v1/pda/task/' + encodeURIComponent(currentTask.barcode));
    if (refreshed.code === 200 && refreshed.data) {
        currentTask = refreshed.data;
        renderCurrentTask();
    } else {
        showTasksPage();
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}

function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, '&quot;');
}

function escapeJs(text) {
    return String(text == null ? '' : text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

async function bootstrap() {
    if (!authToken || !loginState) {
        showLoginPage();
        return;
    }
    document.getElementById('logoutBtn').style.display = 'inline-block';
    setSummary();
    showTasksPage();
    try {
        await refreshTasks();
    } catch (e) {
        toast(e.message || '初始化失败', 'error');
    }
}

setInterval(() => {
    if (document.getElementById('tasksPage').classList.contains('active') && authToken) {
        refreshTasks().catch(() => {});
    }
}, 8000);

bootstrap();
</script>
