<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煎药室在线管理看板</title>
    <style>
        :root {
            --bg: #07111f;
            --panel: rgba(12, 24, 41, 0.92);
            --panel-soft: rgba(18, 33, 56, 0.88);
            --border: rgba(92, 128, 173, 0.22);
            --text: #e9f2ff;
            --text-dim: #8aa0be;
            --cyan: #58d2e8;
            --blue: #67aefc;
            --green: #34d399;
            --yellow: #fbbf24;
            --orange: #fb923c;
            --red: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; background: radial-gradient(circle at top, #143155 0%, #0b1730 28%, #07111f 100%); color: var(--text); font-family: "Segoe UI", "PingFang SC", sans-serif; }
        body { padding: 18px; }
        .shell { max-width: 1480px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            padding: 18px 22px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: linear-gradient(90deg, rgba(18,33,56,0.95) 0%, rgba(12,24,41,0.9) 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.22);
        }
        .header h1 { font-size: 28px; color: var(--cyan); letter-spacing: 1px; }
        .header p { color: var(--text-dim); margin-top: 6px; font-size: 13px; }
        .header-right { text-align: right; min-width: 240px; }
        .clock { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .status-line { margin-top: 8px; display: flex; justify-content: flex-end; gap: 10px; align-items: center; color: var(--text-dim); font-size: 13px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(52,211,153,0.5); }
        .dot.offline { background: var(--red); box-shadow: none; }
        .login-card, .panel {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 18px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.22);
        }
        .login-card {
            max-width: 420px;
            margin: 70px auto 0;
            padding: 28px;
        }
        .login-card h2 { font-size: 22px; color: var(--cyan); margin-bottom: 10px; }
        .login-card p { color: var(--text-dim); font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
        .label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 1px; }
        .input {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(5,11,21,0.92);
            color: var(--text);
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            margin-bottom: 14px;
        }
        .input:focus { outline: none; border-color: rgba(88,210,232,0.45); }
        .btn {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn.primary { background: linear-gradient(90deg, var(--cyan), var(--blue)); color: #07111f; }
        .btn.secondary { background: rgba(88,210,232,0.08); color: var(--cyan); border: 1px solid rgba(88,210,232,0.25); }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .toolbar-left { display: flex; gap: 10px; align-items: center; }
        .toolbar-right { display: flex; gap: 10px; align-items: center; color: var(--text-dim); font-size: 13px; }
        .grid {
            display: grid;
            grid-template-columns: 1.05fr 1.25fr 0.9fr;
            grid-template-rows: auto auto;
            gap: 16px;
        }
        .stats {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
        }
        .stat {
            padding: 18px 20px;
            background: var(--panel-soft);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .stat .name { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 10px; }
        .stat .value { font-size: 34px; font-weight: 700; }
        .panel { padding: 16px; min-height: 260px; }
        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .panel-title strong { color: var(--cyan); font-size: 15px; letter-spacing: 1px; }
        .panel-title span { color: var(--text-dim); font-size: 12px; }
        .managed-list, .task-list, .alarm-list, .device-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .managed-item, .task-item, .alarm-item, .device-item {
            border: 1px solid rgba(92, 128, 173, 0.16);
            background: rgba(6, 12, 22, 0.82);
            border-radius: 14px;
            padding: 14px;
        }
        .managed-item {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.9fr;
            gap: 12px;
            align-items: center;
        }
        .managed-main strong, .device-item strong, .task-item strong { display: block; font-size: 16px; margin-bottom: 6px; }
        .managed-main span, .managed-side span, .task-item span, .device-item span, .alarm-item span {
            display: block;
            color: var(--text-dim);
            font-size: 12px;
            line-height: 1.7;
        }
        .managed-side { text-align: left; }
        .managed-user {
            color: var(--green);
            font-weight: 700;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge.ok { color: #a7f3d0; background: rgba(52,211,153,0.12); }
        .badge.warn { color: #fde68a; background: rgba(251,191,36,0.12); }
        .badge.off { color: #fecaca; background: rgba(248,113,113,0.12); }
        .distribution-bar {
            margin-bottom: 12px;
        }
        .distribution-head {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .distribution-track {
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(92, 128, 173, 0.16);
        }
        .distribution-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--cyan), var(--blue));
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            color: var(--text-dim);
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
        }
        .hidden { display: none !important; }
        .toast-wrap {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .toast {
            min-width: 260px;
            max-width: 360px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(12,24,41,0.96);
            border: 1px solid var(--border);
            box-shadow: 0 12px 28px rgba(0,0,0,0.24);
            font-size: 13px;
        }
        .toast.error { border-color: rgba(248,113,113,0.35); }
        .toast.warn { border-color: rgba(251,191,36,0.35); }
        @media (max-width: 1180px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .grid { grid-template-columns: 1fr; }
            .managed-item { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="header">
        <div>
            <h1>煎药室在线管理看板</h1>
            <p>只展示已登记并进入生产链路的设备，当前看板重点关注 PDA 在线、人员绑定和任务推进。</p>
        </div>
        <div class="header-right">
            <div class="clock" id="clock">--:--:--</div>
            <div class="status-line">
                <span class="dot" id="connDot"></span>
                <span id="connText">等待登录</span>
            </div>
        </div>
    </div>

    <div class="login-card" id="loginView">
        <h2>后台登录</h2>
        <p>登录后看板会读取真实任务、设备和网关在线映射，不再使用演示数据。</p>
        <div class="label">用户名</div>
        <input class="input" id="loginUsername" placeholder="请输入后台账号">
        <div class="label">密码</div>
        <input class="input" id="loginPassword" type="password" placeholder="请输入后台密码">
        <button class="btn primary" style="width:100%;" onclick="login()">登录看板</button>
    </div>

    <div id="dashboardView" class="hidden">
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="btn primary" onclick="refreshAll()">立即刷新</button>
                <button class="btn secondary" onclick="logout()">退出</button>
            </div>
            <div class="toolbar-right">
                <span id="operatorInfo">未登录</span>
                <span id="refreshInfo">最近刷新：--</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="name">今日处方数</div>
                <div class="value" id="statPrescription">0</div>
            </div>
            <div class="stat">
                <div class="name">进行中任务</div>
                <div class="value" id="statPending">0</div>
            </div>
            <div class="stat">
                <div class="name">在线设备</div>
                <div class="value" id="statOnline">0</div>
            </div>
            <div class="stat">
                <div class="name">已匹配 PDA 用户</div>
                <div class="value" id="statMatched">0</div>
            </div>
            <div class="stat">
                <div class="name">当前告警</div>
                <div class="value" id="statAlarm">0</div>
            </div>
        </div>

        <div class="grid" style="margin-top:16px;">
            <div class="panel">
                <div class="panel-title">
                    <strong>任务阶段分布</strong>
                    <span id="distributionMeta">实时统计</span>
                </div>
                <div id="distributionList"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <strong>PDA 在线管理</strong>
                    <span id="managedMeta">0 台</span>
                </div>
                <div class="managed-list" id="managedList"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <strong>最近告警</strong>
                    <span id="alarmMeta">0 条</span>
                </div>
                <div class="alarm-list" id="alarmList"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <strong>最近任务</strong>
                    <span id="taskMeta">0 条</span>
                </div>
                <div class="task-list" id="taskList"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <strong>设备状态清单</strong>
                    <span id="deviceMeta">0 台</span>
                </div>
                <div class="device-list" id="deviceList"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const API_BASE = '';
const STORE = {
    token: 'dashboard_token_v2',
    user: 'dashboard_user_v2'
};

let token = localStorage.getItem(STORE.token) || '';
let loginUser = parseJson(localStorage.getItem(STORE.user)) || null;
let metrics = {};
let stageDistribution = [];
let managedDevices = [];
let devices = [];
let alarms = [];
let recentTasks = [];

function parseJson(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
}

function toast(message, type = 'success') {
    const wrap = document.getElementById('toastWrap');
    const item = document.createElement('div');
    item.className = 'toast ' + type;
    item.textContent = message;
    wrap.appendChild(item);
    setTimeout(() => {
        item.style.opacity = '0';
        item.style.transition = 'opacity 0.3s ease';
        setTimeout(() => item.remove(), 300);
    }, 2500);
}

function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

async function request(path, options = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) {
        headers.Authorization = 'Bearer ' + token;
    }
    const response = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
    let payload;
    try {
        payload = await response.json();
    } catch (e) {
        payload = { code: response.status, message: '接口返回不可解析' };
    }
    if (response.status === 401) {
        logout(false);
        throw new Error(payload.message || '登录失效');
    }
    return payload;
}

async function login() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!username || !password) {
        toast('请输入账号和密码', 'warn');
        return;
    }
    const response = await fetch(API_BASE + '/api/v1/rbac/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const result = await response.json();
    if (result.code !== 200 || !result.data || !result.data.token) {
        toast(result.message || '登录失败', 'error');
        return;
    }
    token = result.data.token;
    loginUser = { username: result.data.username || username, userId: result.data.userId };
    localStorage.setItem(STORE.token, token);
    localStorage.setItem(STORE.user, JSON.stringify(loginUser));
    showDashboard();
    toast('看板已连接真实后台');
    await refreshAll();
}

function logout(showToast = true) {
    token = '';
    loginUser = null;
    localStorage.removeItem(STORE.token);
    localStorage.removeItem(STORE.user);
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    updateConnection(false, '等待登录');
    if (showToast) {
        toast('已退出看板');
    }
}

function showDashboard() {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('dashboardView').classList.remove('hidden');
    document.getElementById('operatorInfo').textContent = '当前账号：' + (loginUser ? loginUser.username : '-');
}

function updateConnection(online, text) {
    const dot = document.getElementById('connDot');
    dot.className = online ? 'dot' : 'dot offline';
    document.getElementById('connText').textContent = text;
}

async function refreshAll() {
    try {
        const [metricsRes, distributionRes, managedRes, devicesRes, alarmsRes, tasksRes] = await Promise.all([
            request('/api/v1/eq/dashboard/metrics'),
            request('/api/v1/eq/dashboard/stage-distribution'),
            request('/api/v1/eq/gateway/online-managed'),
            request('/api/v1/eq/devices?page=1&size=50'),
            request('/api/v1/eq/alarms?page=1&size=10'),
            request('/api/v1/pda/online/list')
        ]);

        metrics = metricsRes.code === 200 && metricsRes.data ? metricsRes.data : {};
        stageDistribution = distributionRes.code === 200 && Array.isArray(distributionRes.data) ? distributionRes.data : [];
        managedDevices = managedRes.code === 200 && Array.isArray(managedRes.data) ? managedRes.data : [];
        devices = devicesRes.code === 200 && devicesRes.data && Array.isArray(devicesRes.data.records) ? devicesRes.data.records : [];
        alarms = alarmsRes.code === 200 && alarmsRes.data && Array.isArray(alarmsRes.data.records) ? alarmsRes.data.records : [];
        recentTasks = tasksRes.code === 200 && Array.isArray(tasksRes.data) ? tasksRes.data : [];

        renderStats();
        renderDistribution();
        renderManagedDevices();
        renderDevices();
        renderAlarms();
        renderTasks();
        updateConnection(true, '数据已连接');
        document.getElementById('refreshInfo').textContent = '最近刷新：' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    } catch (e) {
        updateConnection(false, e.message || '连接失败');
        toast(e.message || '刷新失败', 'error');
    }
}

function renderStats() {
    document.getElementById('statPrescription').textContent = metrics.todayPrescription || 0;
    document.getElementById('statPending').textContent = metrics.pendingCount || 0;
    document.getElementById('statOnline').textContent = managedDevices.length;
    document.getElementById('statMatched').textContent = managedDevices.filter(item => item.userCode).length;
    document.getElementById('statAlarm').textContent = alarms.length;
}

function renderDistribution() {
    const container = document.getElementById('distributionList');
    if (!stageDistribution.length) {
        container.innerHTML = '<div class="empty">暂无阶段分布数据</div>';
        return;
    }
    const max = Math.max(...stageDistribution.map(item => item.count || 0), 1);
    container.innerHTML = stageDistribution.map(item => {
        const count = item.count || 0;
        const width = Math.max(8, Math.round((count / max) * 100));
        return `
            <div class="distribution-bar">
                <div class="distribution-head">
                    <span>${escapeHtml(item.stage || '未知阶段')}</span>
                    <span>${count}</span>
                </div>
                <div class="distribution-track">
                    <div class="distribution-fill" style="width:${width}%;"></div>
                </div>
            </div>
        `;
    }).join('');
}

function renderManagedDevices() {
    const container = document.getElementById('managedList');
    document.getElementById('managedMeta').textContent = managedDevices.length + ' 台';
    if (!managedDevices.length) {
        container.innerHTML = '<div class="empty">当前没有已接入的生产 PDA 设备</div>';
        return;
    }
    container.innerHTML = managedDevices.map(item => {
        const matched = item.userCode
            ? `<span class="managed-user">${escapeHtml(item.userName || item.userCode)}</span>`
            : '<span class="badge warn">未登录人员</span>';
        return `
            <div class="managed-item">
                <div class="managed-main">
                    <strong>${escapeHtml(item.deviceCode || '-')}</strong>
                    <span>协议：${escapeHtml(item.protocolType || '-')}</span>
                    <span>MAC：${escapeHtml(item.macAddress || '-')}</span>
                    <span>最近在线：${escapeHtml(formatDateTime(item.lastSeenAt))}</span>
                </div>
                <div class="managed-side">
                    <span>当前人员</span>
                    ${matched}
                    <span style="margin-top:6px;">匹配时间：${escapeHtml(formatDateTime(item.matchedAt))}</span>
                </div>
                <div class="managed-side">
                    <span>来源 IP</span>
                    <strong style="font-size:15px;">${escapeHtml(item.sourceIp || '-')}</strong>
                    <span>${item.userCode ? '已进入生产链路' : '设备在线，待人员登录'}</span>
                </div>
            </div>
        `;
    }).join('');
}

function renderDevices() {
    const container = document.getElementById('deviceList');
    document.getElementById('deviceMeta').textContent = devices.length + ' 台';
    if (!devices.length) {
        container.innerHTML = '<div class="empty">暂无设备清单</div>';
        return;
    }
    container.innerHTML = devices.slice(0, 12).map(device => {
        const badge = resolveDeviceBadge(device.detailStatus || device.status);
        return `
            <div class="device-item">
                <strong>${escapeHtml(device.name || device.deviceCode || '-')}</strong>
                <span>设备编码：${escapeHtml(device.deviceCode || '-')}</span>
                <span>状态：<span class="badge ${badge.cls}">${escapeHtml(badge.text)}</span></span>
                <span>温度：${device.currentTemp != null ? device.currentTemp + '℃' : '--'}</span>
                <span>通信ID：${escapeHtml(device.communicationId || '-')}</span>
            </div>
        `;
    }).join('');
}

function renderAlarms() {
    const container = document.getElementById('alarmList');
    document.getElementById('alarmMeta').textContent = alarms.length + ' 条';
    if (!alarms.length) {
        container.innerHTML = '<div class="empty">当前没有设备告警</div>';
        return;
    }
    container.innerHTML = alarms.map(item => `
        <div class="alarm-item">
            <strong style="display:block;font-size:14px;margin-bottom:6px;">${escapeHtml(item.deviceCode || '-')} / ${escapeHtml(item.alarmType || '-')}</strong>
            <span>${escapeHtml(item.content || '-')}</span>
            <span>状态：${escapeHtml(item.status || '-')} | 时间：${escapeHtml(formatDateTime(item.createdAt))}</span>
        </div>
    `).join('');
}

function renderTasks() {
    const container = document.getElementById('taskList');
    document.getElementById('taskMeta').textContent = recentTasks.length + ' 条';
    if (!recentTasks.length) {
        container.innerHTML = '<div class="empty">当前没有在线 PDA 登录记录</div>';
        return;
    }
    container.innerHTML = recentTasks.map(item => `
        <div class="task-item">
            <strong>${escapeHtml(item.userName || item.userCode || '-')}</strong>
            <span>设备：${escapeHtml(item.deviceCode || '-')}</span>
            <span>登录时间：${escapeHtml(formatDateTime(item.loginTime))}</span>
            <span>IP：${escapeHtml(item.ipAddress || '-')}</span>
        </div>
    `).join('');
}

function resolveDeviceBadge(status) {
    const normalized = (status || '').toUpperCase();
    if (normalized.includes('FAULT')) return { cls: 'off', text: status || 'FAULT' };
    if (normalized.includes('OFFLINE')) return { cls: 'off', text: status || 'OFFLINE' };
    if (normalized.includes('IDLE') || normalized.includes('READY')) return { cls: 'ok', text: status || 'IDLE' };
    return { cls: 'warn', text: status || 'BUSY' };
}

function formatDateTime(value) {
    if (!value) return '-';
    const normalized = String(value).replace(' ', 'T');
    const date = new Date(normalized);
    if (Number.isNaN(date.getTime())) {
        return value;
    }
    return date.toLocaleString('zh-CN', { hour12: false });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}

async function bootstrap() {
    if (!token || !loginUser) {
        logout(false);
        return;
    }
    showDashboard();
    updateConnection(true, '正在加载');
    await refreshAll();
}

setInterval(() => {
    if (token) {
        refreshAll().catch(() => {});
    }
}, 10000);

bootstrap();
</script>
</body>
</html>
