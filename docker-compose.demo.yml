version: '3.8'

services:
  # --------------------------------------------------
  # MySQL 8.0（演示环境）
  # --------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: openygt-dms-mysql-demo
    environment:
      MYSQL_ROOT_PASSWORD: mysql_pwd01
      MYSQL_DATABASE: openygt-dms
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./dms-app/src/main/resources/db/migration:/docker-entrypoint-initdb.d/migration:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql_pwd01"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openygt-dms-net

  # --------------------------------------------------
  # Redis（缓存 + Session）
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: openygt-dms-redis-demo
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - openygt-dms-net

  # --------------------------------------------------
  # 后端服务（Spring Boot）
  # --------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: openygt-dms-backend-demo
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/openygt-dms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql_pwd01
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "9092:9092"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - openygt-dms-net

  # --------------------------------------------------
  # 前端服务（Vue 3 + Vite）
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: openygt-dms-frontend-demo
    environment:
      VITE_API_BASE_URL: http://localhost:9092
    ports:
      - "5172:80"
    depends_on:
      - backend
    networks:
      - openygt-dms-net

volumes:
  mysql-data:
  redis-data:

networks:
  openygt-dms-net:
    driver: bridge
